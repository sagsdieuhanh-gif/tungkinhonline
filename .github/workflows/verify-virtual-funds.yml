name: Verify virtual lucky envelopes
on:
  push:
    paths:
      - server.js
      - public/js/live.js
      - public/index.html
      - public/admin.html
      - tests/virtual-funds.test.cjs
      - .github/workflows/verify-virtual-funds.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Check server and browser script syntax
        run: |
          node --check server.js
          node --check public/js/live.js
          node --check public/js/audio.js
          node --check tests/virtual-funds.test.cjs
      - name: Test random virtual envelopes and rituals
        run: node tests/virtual-funds.test.cjs
