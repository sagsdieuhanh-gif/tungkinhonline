name: Import original TikTok Live Temple source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tungkinhonline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download original source without executing it
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/zane-tv/tiktok-live-temple-rpc.git /tmp/tiktok-live-temple-source
          rsync -a --exclude='.git' --exclude='.github' /tmp/tiktok-live-temple-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import original TikTok Live Temple source"
            git push origin HEAD:main
          fi
